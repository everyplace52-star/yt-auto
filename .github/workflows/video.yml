name: make-videos

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos"
        default: "1"
      upload:
        description: "Upload to YouTube? (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          pip install -U edge-tts

      - name: Restore saved scripts
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: scripts-${{ github.run_id }}
          restore-keys: scripts-

      - name: Restore YouTube token
        env:
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
        run: echo "$YT_TOKEN_B64" | base64 -d > token.json

      - name: Make videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then FLAGS="--no-upload"; fi
          python pipeline.py --count ${{ github.event.inputs.count || '3' }} $FLAGS

      - name: Save scripts for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: scripts-${{ github.run_id }}

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          if-no-files-found: warn
          retention-days: 3

      - name: Save progress
        if: ${{ github.event.inputs.upload != 'false' }}
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add done.json || true
          git commit -m "update progress" || echo "nothing to commit"
          git push
